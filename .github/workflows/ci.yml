name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      SCHEDULER_REDIS_TEST_URL: redis://127.0.0.1:6379/15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...

      - name: Run race-enabled tests
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Build production binary
        run: go build -trimpath -ldflags='-s -w' -o /tmp/kokoro-scheduler ./cmd/scheduler

      - name: Build production image
        run: docker build --tag kokoro-scheduler:ci .
