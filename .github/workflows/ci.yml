name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      SCHEDULER_REDIS_TEST_URL: redis://127.0.0.1:6379/15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan source and dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Verify module checksums
        run: go mod verify

      - name: Run tests
        run: go test ./...

      - name: Run race-enabled tests
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Build production binary
        run: go build -trimpath -ldflags='-s -w' -o /tmp/kokoro-scheduler ./cmd/scheduler

      - name: Build production image
        run: docker build --tag kokoro-scheduler:ci .
